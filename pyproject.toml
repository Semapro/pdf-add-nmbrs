[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pdf-add-nmbrs"
version = "0.1.0"
description = "Add line numbers to PDF review copies"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Semapro" },
]
dependencies = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "mypy>=1.10,<3",
  "pyinstaller>=6.21,<7",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
pdf-add-nmbrs = "pdf_add_nmbrs.cli:main"
pdf-line-numbers = "pdf_add_nmbrs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_add_nmbrs"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pdf_line_numbers.py",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
required-version = ">=0.5,<1"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pdf_add_nmbrs"]
mypy_path = ["src"]
warn_unused_configs = true

[tool.coverage.run]
source = ["pdf_add_nmbrs"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

